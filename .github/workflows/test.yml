name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in $(find js tests -name '*.js'); do
            node --check "$f"
          done
      - name: Tests
        run: node tests/run.js
